<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ledger — demo app</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f7f9;
        --surface: #ffffff;
        --text: #141a22;
        --muted: #5b6673;
        --border: #d9dee5;
        --accent: #1f6feb;
        --danger: #b42318;
        --income: #0a7d4f;
        --expense: #b42318;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1319;
          --surface: #161c24;
          --text: #e8edf3;
          --muted: #9aa6b3;
          --border: #2a333d;
          --accent: #4c8dff;
          --danger: #ff8a80;
          --income: #48d18a;
          --expense: #ff8a80;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 24px 16px 64px;
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      main { width: 100%; max-width: 760px; margin: 0 auto; }
      h1 { font-size: 20px; margin: 0; }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 20px;
      }
      label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
      input, select {
        width: 100%;
        padding: 9px 11px;
        font: inherit;
        color: inherit;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      button {
        font: inherit;
        font-weight: 600;
        padding: 9px 16px;
        color: #fff;
        background: var(--accent);
        border: 0;
        border-radius: 8px;
        cursor: pointer;
      }
      button.secondary { background: transparent; color: var(--muted); border: 1px solid var(--border); }
      .field { margin-bottom: 14px; }
      .row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
      .row .field { flex: 1 1 140px; margin-bottom: 0; }
      .error { color: var(--danger); font-size: 13px; margin: 10px 0 0; }
      header.bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
      }
      .balance { color: var(--muted); margin: 0 0 16px; }
      .balance strong { color: var(--text); font-size: 22px; margin-left: 6px; }
      .toolbar { display: flex; gap: 10px; align-items: center; margin: 20px 0 8px; }
      .toolbar label { margin: 0; }
      .toolbar select { width: auto; min-width: 130px; }
      .table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
      table { width: 100%; border-collapse: collapse; font-size: 14px; }
      th, td { padding: 10px 12px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--border); }
      th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
      tbody tr:last-child td { border-bottom: 0; }
      td.amount { text-align: right; font-variant-numeric: tabular-nums; }
      td.income { color: var(--income); }
      td.expense { color: var(--expense); }
      td.note { white-space: normal; min-width: 120px; }
      .empty { color: var(--muted); text-align: center; padding: 28px 12px; margin: 0; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <section id="login-view" class="card" hidden>
        <h1>Sign in</h1>
        <p class="balance">Enter the demo passcode to open the ledger.</p>
        <form id="login-form" novalidate>
          <div class="field">
            <label for="passcode">Passcode</label>
            <input id="passcode" name="passcode" type="password" autocomplete="off" />
          </div>
          <button id="login" type="submit">Sign in</button>
          <p id="login-error" class="error" role="alert" hidden></p>
        </form>
      </section>

      <section id="app-view" hidden>
        <header class="bar">
          <h1>Transactions</h1>
          <button id="logout" class="secondary" type="button">Sign out</button>
        </header>

        <p class="balance">Balance<strong id="balance">—</strong></p>

        <form id="txn-form" class="card" novalidate>
          <div class="row">
            <div class="field">
              <label for="type">Type</label>
              <select id="type" name="type">
                <option value="expense">Expense</option>
                <option value="income">Income</option>
              </select>
            </div>
            <div class="field">
              <label for="amount">Amount (VND)</label>
              <input id="amount" name="amount" inputmode="decimal" placeholder="0.00" autocomplete="off" />
            </div>
            <div class="field">
              <label for="note">Note</label>
              <input id="note" name="note" maxlength="120" autocomplete="off" />
            </div>
            <button id="add" type="submit">Add</button>
          </div>
          <p id="form-error" class="error" role="alert" hidden></p>
        </form>

        <div class="toolbar">
          <label for="filter">Show</label>
          <select id="filter">
            <option value="">All</option>
            <option value="income">Income</option>
            <option value="expense">Expense</option>
          </select>
        </div>

        <div class="table-wrap">
          <table id="txn-table">
            <thead>
              <tr>
                <th scope="col">ID</th>
                <th scope="col">Type</th>
                <th scope="col">Amount</th>
                <th scope="col">Note</th>
              </tr>
            </thead>
            <tbody id="txn-rows"></tbody>
          </table>
          <p id="empty-state" class="empty" hidden>No transactions yet.</p>
        </div>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
